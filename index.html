<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LM 2026 Fit Tech Shoot</title>
  <style>
    :root {
      --red: #C8102E;
      --red-dark: #a00d24;
      --red-light: #fff0f2;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #6c6c70;
      --border: #d8d8dc;
      --green: #30d158;
      --green-bg: #e6f9ed;
      --blue: #0071e3;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --r: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', sans-serif; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #2c2c2e 0%, #1c1c1e 100%);
      color: white;
      padding: 30px 20px 20px;
    }
    .header-inner {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }
    .header h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.4px; }
    .header .sub { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-header {
      background: rgba(255,255,255,0.18);
      color: white;
      border: 1px solid rgba(255,255,255,0.32);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-header:hover { background: rgba(255,255,255,0.28); }

    /* ── Tab Bar ── */
    .tabbar-wrap {
      background: linear-gradient(135deg, #2c2c2e 0%, #1c1c1e 100%);
      border-bottom: 1px solid rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tabbar {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 0 4px;
    }
    .tabbar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 11px 13px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      position: relative;
      transition: color 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tab-btn:hover { color: rgba(255,255,255,0.9); }
    .tab-btn.active { color: white; font-weight: 700; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 8px; right: 8px;
      height: 2.5px;
      background: white;
      border-radius: 2px 2px 0 0;
    }
    .tab-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      flex-shrink: 0;
    }
    .tab-dot.filled { background: var(--green); }

    /* ── Main ── */
    .main {
      max-width: 880px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }
    .day-panel { display: none; }
    .day-panel.active { display: block; }

    /* ── Day Header ── */
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .day-header h2 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .progress-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }
    .progress-pill .pbar {
      width: 60px;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-pill .pbar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* ── Info Card ── */
    .info-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 580px) { .info-card { grid-template-columns: 1fr; } }    .info-field label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .info-field .field-icon { margin-right: 4px; }
    .info-field input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .info-field input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(200,16,46,0.1);
    }
    .info-field input::placeholder { color: #c0c0c5; }

    /* ── Base Camp ── */
    .basecamp-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 13px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid #2c2c2e;
    }
    .basecamp-icon { font-size: 20px; flex-shrink: 0; }
    .basecamp-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .basecamp-address {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin: 20px 0 10px;
      padding-left: 2px;
    }

    /* ── Location Card ── */
    .location-card {
      background: var(--card);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .location-header {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #f2f2f7;
      border-bottom: 1px solid var(--border);
      padding: 11px 16px;
      flex-wrap: wrap;
    }
    .loc-maps-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 500;
      color: #0071e3;
      text-decoration: none;
      background: #e8f0fe;
      border-radius: 6px;
      padding: 3px 9px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .loc-maps-link:hover { background: #d0e4ff; }
    .loc-pin { font-size: 15px; flex-shrink: 0; }
    .loc-name-input {
      flex: 1;
      border: none;
      padding: 0;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      outline: none;
      letter-spacing: 0.1px;
    }
    .loc-name-input::placeholder { color: #bbb; font-weight: 400; }
    .btn-remove-loc {
      background: none;
      border: none;
      color: #c0c0c5;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 5px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .btn-remove-loc:hover { color: var(--red); }
    /* ── Trainer Tab Bar ── */
    .trainer-tabs-bar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      min-height: 40px;
    }
    .trainer-tabs-bar::-webkit-scrollbar { display: none; }
    .trainer-tab-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 8px 10px 6px;
      border-bottom: 2.5px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s;
      position: relative;
    }
    .trainer-tab-wrap.active {
      border-bottom-color: var(--red);
    }
    .trainer-tab-name {
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      color: var(--muted);
      outline: none;
      cursor: pointer;
      min-width: 60px;
      max-width: 120px;
      padding: 0;
      transition: color 0.15s;
    }
    .trainer-tab-name.active {
      color: var(--red);
      font-weight: 700;
    }
    .trainer-tab-name::placeholder { color: #ccc; }
    .btn-remove-trainer {
      background: none;
      border: none;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      padding: 1px 2px;
      border-radius: 3px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .btn-remove-trainer:hover { color: var(--red); }
    .btn-add-trainer {
      flex-shrink: 0;
      margin-left: 4px;
      padding: 5px 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-add-trainer:hover {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-light);
    }

    .location-shots {
      padding: 12px 16px 14px;
    }
    .shots-heading {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* ── Shot Items ── */
    .shot-list { margin-bottom: 8px; }
    .shot-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 4px;
      border-radius: 7px;
      transition: background 0.1s;
    }
    .shot-item:hover { background: #f9f9fb; }
    .shot-cb {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--green);
    }
    .shot-text-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      padding: 2px 0;
      transition: color 0.2s;
      min-width: 0;
    }
    .shot-text-input.done {
      text-decoration: line-through;
      color: var(--muted);
    }
    .shot-text-input::placeholder { color: #c8c8cc; }
    .btn-remove-shot {
      background: none;
      border: none;
      color: transparent;
      cursor: pointer;
      font-size: 16px;
      padding: 2px 5px;
      border-radius: 5px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .shot-item:hover .btn-remove-shot { color: #ccc; }
    .btn-remove-shot:hover { color: var(--red) !important; }

    /* ── Add Buttons ── */
    .btn-add-shot {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding: 7px 10px;
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 4px;
    }
    .btn-add-shot:hover {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-light);
    }
    .btn-add-location {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: var(--card);
      border: 1.5px dashed var(--border);
      border-radius: var(--r);
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 16px;
      transition: all 0.15s;
      box-shadow: var(--shadow);
    }
    .btn-add-location:hover {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-light);
    }

    /* ── End of Day ── */
    .eod-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--red);
    }
    .eod-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--red);
      margin-bottom: 14px;
    }
    .eod-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .eod-item:last-child { border-bottom: none; }
    .eod-cb {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--red);
    }
    .eod-label {
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .eod-item.checked .eod-label {
      text-decoration: line-through;
      color: var(--muted);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: #1c1c1e;
      color: white;
      padding: 11px 22px;
      border-radius: 22px;
      font-size: 13.5px;
      font-weight: 500;
      z-index: 9999;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Print ── */
    @media print {
      .tabbar-wrap, .header-actions, .btn-add-shot, .btn-add-location,
      .btn-remove-shot, .btn-remove-loc, .toast { display: none !important; }
      .day-panel { display: block !important; page-break-after: always; }
      body { background: white; font-size: 12px; }
      .header { background: var(--red) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div>
      <h1>LM 2026 Fit Tech Shoot</h1>
      <p class="sub">Fit Tech Shoot &nbsp;·&nbsp; 17–26 April 2026</p>
    </div>
    <div class="header-actions">
      <button class="btn-header" onclick="shareState()">🔗 Share Link</button>
      <button class="btn-header" onclick="exportJSON()">⬇ Export</button>
      <button class="btn-header" onclick="importJSON()">⬆ Import</button>
      <button class="btn-header" onclick="window.print()">🖨 Print</button>
    </div>
  </div>
</header>

<div class="tabbar-wrap">
  <div class="tabbar" id="tabbar"></div>
</div>

<div class="main" id="main"></div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
